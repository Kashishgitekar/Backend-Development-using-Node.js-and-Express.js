<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>All Blogs</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="topnav">
      <span class="brand">📝 My Blog</span>
      <a href="index.html">Login</a>
      <a href="dashboard.html">My blogs</a>
      <a href="create.html">New blog</a>
    </nav>

    <h1>All Blogs</h1>

    <div class="filters">
      <input id="search" placeholder="Search blogs..." oninput="debouncedLoad()" />
      <select id="category" onchange="loadBlogs()">
        <option value="">All categories</option>
        <option value="general">General</option>
        <option value="tech">Tech</option>
        <option value="lifestyle">Lifestyle</option>
        <option value="education">Education</option>
        <option value="travel">Travel</option>
        <option value="food">Food</option>
        <option value="other">Other</option>
      </select>
    </div>

    <div id="blogs-list"><div class="empty">Loading blogs...</div></div>

    <script src="config.js"></script>
    <script>
      let debounceTimer;

      function debouncedLoad() {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(loadBlogs, 300);
      }

      async function loadBlogs() {
        const container = document.getElementById("blogs-list");
        const search = document.getElementById("search").value.trim();
        const category = document.getElementById("category").value;

        const params = new URLSearchParams();
        if (search) params.set("search", search);
        if (category) params.set("category", category);

        try {
          const response = await fetch(`${API_URL}/blogs?${params}`);
          const data = await response.json();

          if (!data.blogs || data.blogs.length === 0) {
            container.innerHTML =
              '<div class="empty">No blogs match your search. Try different keywords.</div>';
            return;
          }

          container.innerHTML = data.blogs
            .map((blog) => {
              const snippet =
                blog.content.length > 150
                  ? blog.content.slice(0, 150) + "..."
                  : blog.content;
              return `
                <div class="card">
                  <h3><a href="blog.html?id=${blog._id}">${esc(blog.title)}</a>
                    <span class="cat-tag">${esc(blog.category || "general")}</span></h3>
                  <div class="meta">
                    By ${esc(blog.author ? blog.author.name : "Unknown")} |
                    ${new Date(blog.createdAt).toLocaleDateString()}
                  </div>
                  <p class="snippet">${esc(snippet)}</p>
                </div>
              `;
            })
            .join("");
        } catch (err) {
          container.innerHTML =
            '<div class="empty alert-error">Failed to load blogs. Is the server running?</div>';
        }
      }

      loadBlogs();
    </script>
  </body>
</html>
