<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Blog</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <nav class="topnav">
    <span class="brand">📝 My Blog</span>
    <a href="blogs.html">All blogs</a>
    <a href="dashboard.html">My blogs</a>
  </nav>
  <h1>Edit Blog</h1>

  <form onsubmit="updateBlog(event)">
    <input id="title" required />
    <select id="category">
      <option value="general">General</option>
      <option value="tech">Tech</option>
      <option value="lifestyle">Lifestyle</option>
      <option value="education">Education</option>
      <option value="travel">Travel</option>
      <option value="food">Food</option>
      <option value="other">Other</option>
    </select>
    <textarea id="content" required></textarea>
    <button type="submit" class="btn-submit">Save Changes</button>
  </form>
  <div id="msg"></div>

  <script src="config.js"></script>
  <script>
    const id = new URLSearchParams(window.location.search).get("id");

    async function loadBlog() {
      if (!id) {
        document.getElementById("msg").innerHTML =
          '<div class="alert-error">No blog id provided.</div>';
        return;
      }

      const response = await fetch(`${API_URL}/blogs/${id}`);
      const data = await response.json();

      if (!response.ok) {
        document.getElementById("msg").innerHTML =
          `<div class="alert-error">${esc(data.message || "Blog not found.")}</div>`;
        return;
      }

      document.getElementById("title").value = data.blog.title;
      document.getElementById("content").value = data.blog.content;
      if (data.blog.category) {
        document.getElementById("category").value = data.blog.category;
      }
    }

    async function updateBlog(e) {
      e.preventDefault();
      const msg = document.getElementById("msg");
      const token = localStorage.getItem("token");

      if (!token) {
        msg.innerHTML = '<div class="alert-error">Please login first.</div>';
        return;
      }

      const response = await fetch(`${API_URL}/blogs/${id}`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          Authorization: `Bearer ${token}`,
        },
        body: JSON.stringify({
          title: document.getElementById("title").value,
          content: document.getElementById("content").value,
          category: document.getElementById("category").value,
        }),
      });

      const data = await response.json();

      if (response.ok) {
        msg.innerHTML = '<div class="alert-success">Blog updated!</div>';
        setTimeout(() => (window.location.href = "dashboard.html"), 800);
      } else {
        msg.innerHTML =
          `<div class="alert-error">${esc(data.message || "Failed")}</div>`;
      }
    }

    loadBlog();
  </script>
</body>

</html>
