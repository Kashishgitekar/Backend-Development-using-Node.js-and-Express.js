<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Blogs Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <nav class="topnav">
    <span class="brand">📝 My Blog</span>
    <a href="blogs.html">All blogs</a>
    <a href="create.html">New blog</a>
  </nav>
  <h1>My Blogs Dashboard</h1>
  <a href="create.html" class="btn btn-create">+ New Blog</a>
  <div id="msg"></div>
  <div id="blogs-list"><div class="empty">Loading your blogs...</div></div>

  <script src="config.js"></script>
  <script>
    const token = localStorage.getItem("token");

    async function loadMyBlogs() {
      const container = document.getElementById("blogs-list");
      const msg = document.getElementById("msg");

      if (!token) {
        container.innerHTML =
          '<div class="empty alert-error">Please login first.</div>';
        return;
      }

      try {
        const response = await fetch(`${API_URL}/blogs/my`, {
          headers: { Authorization: `Bearer ${token}` },
        });

        if (!response.ok) {
          const data = await response.json();
          container.innerHTML =
            `<div class="empty alert-error">${esc(data.message || "Failed to load.")}</div>`;
          return;
        }

        const data = await response.json();

        if (data.blogs.length === 0) {
          container.innerHTML =
            '<div class="empty">You haven\'t written any blogs yet. <a href="create.html">Write your first one!</a></div>';
          return;
        }

        container.innerHTML = data.blogs
          .map((blog) => {
            const snippet =
              blog.content.length > 150
                ? blog.content.slice(0, 150) + "..."
                : blog.content;
            return `
                <div class="card">
                  <h3>${esc(blog.title)} <span class="cat-tag">${esc(blog.category || "general")}</span></h3>
                  <div class="meta">
                    ${new Date(blog.createdAt).toLocaleString()}
                  </div>
                  <p class="snippet">${esc(snippet)}</p>
                  <a class="btn btn-view" href="blog.html?id=${blog._id}">View</a>
                  <a class="btn btn-edit" href="edit.html?id=${blog._id}">Edit</a>
                  <button class="btn btn-delete" onclick="deleteBlog('${blog._id}')">Delete</button>
                </div>
              `;
          })
          .join("");
      } catch (err) {
        container.innerHTML =
          '<div class="empty alert-error">Failed to load. Is the server running?</div>';
      }
    }

    async function deleteBlog(id) {
      if (!confirm("Delete this blog permanently?")) return;

      const response = await fetch(`${API_URL}/blogs/${id}`, {
        method: "DELETE",
        headers: { Authorization: `Bearer ${token}` },
      });

      if (response.ok) {
        document.getElementById("msg").innerHTML =
          '<div class="alert-success">Blog deleted.</div>';
        loadMyBlogs(); // refresh the list
      } else {
        const data = await response.json();
        document.getElementById("msg").innerHTML =
          `<div class="alert-error">${esc(data.message || "Delete failed.")}</div>`;
      }
    }

    loadMyBlogs();
  </script>
</body>

</html>
