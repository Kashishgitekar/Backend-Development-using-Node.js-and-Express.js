<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>My Blogs Dashboard</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 800px;
        margin: 30px auto;
        padding: 0 15px;
      }
      .blog-card {
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 15px 20px;
        margin-bottom: 15px;
      }
      .blog-card h3 { margin: 0 0 5px; }
      .meta { color: #666; font-size: 0.85rem; }
      .snippet { color: #333; margin-top: 8px; }
      .btn {
        display: inline-block;
        padding: 6px 12px;
        margin-right: 6px;
        border-radius: 5px;
        text-decoration: none;
        font-size: 0.85rem;
        border: none;
        cursor: pointer;
      }
      .btn-view { background: #2563eb; color: white; }
      .btn-edit { background: #f59e0b; color: white; }
      .btn-delete { background: #dc2626; color: white; }
      .btn-create { background: #16a34a; color: white; padding: 10px 16px; }
      .cat-tag {
        display: inline-block;
        background: #e5e7eb;
        border-radius: 10px;
        padding: 2px 10px;
        font-size: 0.75rem;
        color: #374151;
      }
      a { color: #2563eb; }
      #msg { margin-top: 10px; }
    </style>
  </head>
  <body>
    <a href="blogs.html">&larr; All blogs</a>
    <h1>My Blogs Dashboard</h1>
    <a href="create.html" class="btn btn-create">+ New Blog</a>
    <div id="msg"></div>
    <div id="blogs-list">Loading your blogs...</div>

    <script>
      const API_URL = "http://localhost:5000/api";
      const token = localStorage.getItem("token");

      async function loadMyBlogs() {
        const container = document.getElementById("blogs-list");
        const msg = document.getElementById("msg");

        if (!token) {
          container.innerHTML =
            "<p style='color:red'>Please login first.</p>";
          return;
        }

        try {
          const response = await fetch(`${API_URL}/blogs/my`, {
            headers: { Authorization: `Bearer ${token}` },
          });

          if (!response.ok) {
            const data = await response.json();
            container.innerHTML =
              `<p style='color:red'>${data.message || "Failed to load."}</p>`;
            return;
          }

          const data = await response.json();

          if (data.blogs.length === 0) {
            container.innerHTML = "<p>You haven't written any blogs yet.</p>";
            return;
          }

          container.innerHTML = data.blogs
            .map((blog) => {
              const snippet =
                blog.content.length > 150
                  ? blog.content.slice(0, 150) + "..."
                  : blog.content;
              return `
                <div class="blog-card">
                  <h3>${blog.title} <span class="cat-tag">${blog.category || "general"}</span></h3>
                  <div class="meta">
                    ${new Date(blog.createdAt).toLocaleString()}
                  </div>
                  <p class="snippet">${snippet}</p>
                  <a class="btn btn-view" href="blog.html?id=${blog._id}">View</a>
                  <a class="btn btn-edit" href="edit.html?id=${blog._id}">Edit</a>
                  <button class="btn btn-delete" onclick="deleteBlog('${blog._id}')">Delete</button>
                </div>
              `;
            })
            .join("");
        } catch (err) {
          container.innerHTML =
            "<p style='color:red'>Failed to load. Is the server running?</p>";
        }
      }

      async function deleteBlog(id) {
        if (!confirm("Delete this blog permanently?")) return;

        const response = await fetch(`${API_URL}/blogs/${id}`, {
          method: "DELETE",
          headers: { Authorization: `Bearer ${token}` },
        });

        if (response.ok) {
          document.getElementById("msg").innerHTML =
            "<p style='color:green'>Blog deleted.</p>";
          loadMyBlogs(); // refresh the list
        } else {
          const data = await response.json();
          document.getElementById("msg").innerHTML =
            `<p style='color:red'>${data.message || "Delete failed."}</p>`;
        }
      }

      loadMyBlogs();
    </script>
  </body>
</html>
