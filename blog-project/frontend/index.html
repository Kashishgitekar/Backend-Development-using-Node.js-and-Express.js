<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog App — Login</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="topnav">
      <span class="brand">📝 My Blog</span>
      <a href="blogs.html">All blogs</a>
    </nav>

    <h1>Welcome to My Blog</h1>

    <div class="card">
      <h2>Login</h2>
      <form onsubmit="login(event)">
        <input id="email" type="email" placeholder="Enter email" required />
        <input id="password" type="password" placeholder="Enter password" required />
        <button type="submit" class="btn-submit">Login</button>
      </form>
    </div>

    <div class="card">
      <h2>Register</h2>
      <form onsubmit="register(event)">
        <input id="reg-name" placeholder="Enter name" required />
        <input id="reg-email" type="email" placeholder="Enter email" required />
        <input id="reg-password" type="password" placeholder="Password (min 6 chars)" minlength="6" required />
        <button type="submit" class="btn-submit">Register</button>
      </form>
    </div>

    <div id="msg"></div>

    <script src="config.js"></script>
    <script>
      function saveToken(data) {
        if (data.token) localStorage.setItem("token", data.token);
      }

      function showMsg(text, ok) {
        document.getElementById("msg").innerHTML = ok
          ? `<div class="alert-success">${esc(text)}</div>`
          : `<div class="alert-error">${esc(text)}</div>`;
      }

      async function register(e) {
        e.preventDefault();
        const response = await fetch(`${API_URL}/register`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: document.getElementById("reg-name").value,
            email: document.getElementById("reg-email").value,
            password: document.getElementById("reg-password").value,
          }),
        });

        const data = await response.json();
        saveToken(data);
        showMsg(data.message, response.ok);

        if (response.ok) {
          setTimeout(() => (window.location.href = "blogs.html"), 800);
        }
      }

      async function login(e) {
        e.preventDefault();
        const response = await fetch(`${API_URL}/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
          }),
        });

        const data = await response.json();
        saveToken(data);
        showMsg(data.message, response.ok);

        if (response.ok) {
          setTimeout(() => (window.location.href = "dashboard.html"), 800);
        }
      }
    </script>
  </body>
</html>
