<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Blog Details</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 800px;
        margin: 30px auto;
        padding: 0 15px;
        line-height: 1.6;
      }
      .meta {
        color: #666;
        font-size: 0.9rem;
      }
      .content {
        white-space: pre-wrap;
        border-top: 1px solid #ddd;
        padding-top: 15px;
        margin-top: 15px;
      }
      a {
        color: #2563eb;
      }
    </style>
  </head>
  <body>
    <a href="blogs.html">&larr; Back to all blogs</a>
    <div id="blog-details">Loading blog...</div>

    <script>
      const API_URL = "http://localhost:5000/api";

      async function loadBlog() {
        const container = document.getElementById("blog-details");
        // Read the blog id from the URL, e.g. blog.html?id=xxxx
        const id = new URLSearchParams(window.location.search).get("id");

        if (!id) {
          container.innerHTML = "<p style='color:red'>No blog id provided.</p>";
          return;
        }

        try {
          const response = await fetch(`${API_URL}/blogs/${id}`);
          const data = await response.json();

          if (!response.ok) {
            container.innerHTML = `<p style='color:red'>${
              data.message || "Blog not found."
            }</p>`;
            return;
          }

          const blog = data.blog;
          document.title = blog.title;

          container.innerHTML = `
            <h1>${blog.title}</h1>
            <div class="meta">
              By ${blog.author ? blog.author.name : "Unknown"} |
              Created ${new Date(blog.createdAt).toLocaleString()}
            </div>
            <div class="content">${blog.content}</div>
          `;
        } catch (err) {
          container.innerHTML =
            "<p style='color:red'>Failed to load blog. Is the server running?</p>";
        }
      }

      loadBlog();
    </script>
  </body>
</html>
