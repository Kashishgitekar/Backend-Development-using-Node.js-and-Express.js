<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog Details</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <nav class="topnav">
    <span class="brand">📝 My Blog</span>
    <a href="blogs.html">All blogs</a>
    <a href="dashboard.html">My blogs</a>
  </nav>
  <div id="blog-details"><div class="empty">Loading blog...</div></div>

  <script src="config.js"></script>
  <script>
    async function loadBlog() {
      const container = document.getElementById("blog-details");
      // Read the blog id from the URL, e.g. blog.html?id=xxxx
      const id = new URLSearchParams(window.location.search).get("id");

      if (!id) {
        container.innerHTML =
          '<div class="empty alert-error">No blog id provided.</div>';
        return;
      }

      try {
        const response = await fetch(`${API_URL}/blogs/${id}`);
        const data = await response.json();

        if (!response.ok) {
          container.innerHTML =
            `<div class="empty alert-error">${esc(data.message || "Blog not found.")}</div>`;
          return;
        }

        const blog = data.blog;
        document.title = blog.title;

        container.innerHTML = `
            <h1>${esc(blog.title)} <span class="cat-tag">${esc(blog.category || "general")}</span></h1>
            <div class="meta">
              By ${esc(blog.author ? blog.author.name : "Unknown")} |
              Created ${new Date(blog.createdAt).toLocaleString()}
            </div>
            <div class="card"><div class="snippet">${esc(blog.content)}</div></div>
            <a href="blogs.html">&larr; Back to all blogs</a>
          `;
      } catch (err) {
        container.innerHTML =
          '<div class="empty alert-error">Failed to load blog. Is the server running?</div>';
      }
    }

    loadBlog();
  </script>
</body>

</html>
